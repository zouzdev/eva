name: Deploy Function App (atlas-eva-funcapp)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Installeer dependencies in /api (waar jouw package.json staat)
      - name: npm ci (api)
        working-directory: api
        run: |
          if [ -f package.json ]; then
            npm ci --no-audit --no-fund
          else
            echo "No package.json in api -> nothing to install"
          fi

      # Optioneel build (alleen als er een build script is)
      - name: npm run build (api) if present
        working-directory: api
        run: |
          if npm run | grep -qE '(^| )build( |:)'; then
            npm run build
          else
            echo "No build script -> skipping"
          fi

      # Deploy de map /api naar jouw Function App
      - name: Deploy to Azure Function App
        uses: Azure/functions-action@v1
        with:
          app-name: atlas-eva-funcapp           # << jouw Function App naam
          package: api                          # << belangrijk: de submap
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}

