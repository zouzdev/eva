name: Build and deploy Function App (Node.js)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Installeer deps in ./api (waar je Functions code staat)
      - name: Install dependencies (api)
        working-directory: api
        run: |
          if [ -f package-lock.json ]; then
            echo "Using npm ci"
            npm ci --no-audit --no-fund
          else
            echo "No lockfile, using npm install"
            npm install --no-audit --no-fund
          fi

      # Alleen uitvoeren als je een build script hebt
      - name: Build (if present)
        working-directory: api
        run: |
          if jq -e '.scripts.build' package.json >/dev/null 2>&1; then
            npm run build
          else
            echo "No build script defined; skipping."
          fi

      - name: Deploy to Azure Functions
        uses: azure/functions-action@v1
        with:
          app-name: atlas-eva-funcapp                 # <— jouw Function App naam
          package: ./api                              # de map met function.json / index.js
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
