name: Deploy Function App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js (voor npm install in ./api)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies (api)
        working-directory: api
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          elif [ -f package.json ]; then
            npm install --no-audit --no-fund
          else
            echo "No package.json in api/, skipping npm install."
          fi

      - name: Deploy to Azure Functions (zip deploy)
        uses: azure/functions-action@v1
        with:
          app-name: atlas-eva-funcapp                 # jouw Function App naam
          package: ./api                              # map met host.json + chat/function.json
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}

      - name: Smoke test
        run: |
          curl -i -X POST "https://atlas-eva-funcapp.azurewebsites.net/api/chat" \
            -H "Content-Type: application/json" \
            -d '{"message":"ping"}' || true
