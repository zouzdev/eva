name: Deploy Function App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 👉 alle npm-stappen in de 'api' map
      - name: Install deps (api)
        working-directory: api
        run: |
          if [ -f package.json ]; then
            npm ci --no-audit --no-fund
          else
            echo "No package.json in api -> skipping npm ci"
          fi

      - name: Build (api)
        working-directory: api
        run: |
          if npm run | grep -q " build"; then
            npm run build
          else
            echo "No build script -> skipping"
          fi

      # 👉 Deploy 'api' als package-path naar jouw Function App
      - name: Deploy to Azure Function App
        uses: Azure/functions-action@v1
        with:
          app-name: atlas-eva-funcapp
          package: api
          # Kies één authenticatie-methode:

          # 1) Met Publish Profile (makkelijkst)
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}

          # 2) OF met OIDC (service principal) – dan eerst azure/login doen
          #  slot-name: production
