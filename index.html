function parseMessageWithCitations(text) {
  // Zoek naar "Bronnen:" of "Sources:"
  const headingRe = /\n\s*(Bronnen|Sources)\s*:\s*\n/i;
  const m = text.match(headingRe);

  let mainText = text;
  let sourcesText = '';
  let headerLabel = 'Bronnen'; // default NL
  let sources = [];

  if (m) {
    const idx = text.search(headingRe);
    mainText = text.slice(0, idx).trimEnd();
    sourcesText = text.slice(idx + m[0].length);
    headerLabel = m[1].charAt(0).toUpperCase() + m[1].slice(1); // behoud taal
  }

  // Als we bronnen hebben, parse ze
  if (sourcesText) {
    const lines = sourcesText.split('\n').map(s => s.trim()).filter(Boolean);
    sources = lines.map((line, i) => {
      const url = (line.match(/https?:\/\/\S+/i) || [,''])[1] || '';
      const parts = line.replace(/\[\d+\]\s*/,'').split('|').map(s => s.trim());

      return {
        number: String(i + 1),
        title: parts[0] || line.replace(/\[\d+\]\s*/,'').trim(),
        location: parts[1] || '',
        date: parts[2] || '',
        url
      };
    });
  }

    });

  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  function renderCitationsBlock(sources, headerLabel = 'Bronnen') {
  if (sources.length === 0) return '';

  // Eén bron → compact zonder kop
  if (sources.length === 1) {
    const s = sources[0];
    const meta = [escapeHtml(s.location || ''), escapeHtml(s.date || '')].filter(Boolean).join(' • ');
    return `
      <div class="citations single">
        <a class="citation-link" ${s.url ? `href="${s.url}" target="_blank" rel="noopener noreferrer"` : ''}>
          <div class="citation-number">1</div>
          <div class="citation-content">
            <div class="citation-title">${escapeHtml(s.title || 'Source')}</div>
            <div class="citation-source">${meta}</div>
          </div>
          <svg class="citation-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6M15 3h6v6M10 14L21 3" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </a>
      </div>`;
  }

  // Meerdere bronnen → lijst met kop (Bronnen/Sources)
  const items = sources.map(s => {
    const meta = [escapeHtml(s.location || ''), escapeHtml(s.date || '')].filter(Boolean).join(' • ');
    const wrapperStart = s.url
      ? `<a class="citation-item" data-source="${s.number}" href="${s.url}" target="_blank" rel="noopener noreferrer">`
      : `<div class="citation-item" data-source="${s.number}">`;
    const wrapperEnd = s.url ? `</a>` : `</div>`;
    return `
      ${wrapperStart}
        <div class="citation-number">${s.number}</div>
        <div class="citation-content">
          <div class="citation-title">${escapeHtml(s.title || 'Source')}</div>
          <div class="citation-source">${meta}</div>
        </div>
        <svg class="citation-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6M15 3h6v6M10 14L21 3" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      ${wrapperEnd}
    `;
  }).join('');

  return `
    <div class="citations">
      <div class="citations-header">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        ${escapeHtml(headerLabel)}
      </div>
      <div class="citation-list">
        ${items}
      </div>
    </div>
  `;
}

  async function callAgent(userMessage, existingThreadId) {
    const res = await fetch(API_CHAT, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        message: userMessage,
        threadId: existingThreadId || null,
        projectUrl: PROJECT_URL,
        agentId: AGENT_ID
      })
    });
    const raw = await res.text().catch(()=> '');
    let data = raw; try { data = JSON.parse(raw); } catch {}
    if(!res.ok){
      throw new Error(`POST ${API_CHAT} ${res.status} ${res.statusText}: ${toDisplayString(data)}`);
    }
    return data;
  }

  function groupSessions(sessions){
    const res = { today: [], yesterday: [], week: [] };
    const nowD = new Date();
    const todayStr = nowD.toDateString();
    const yD = new Date(nowD); yD.setDate(nowD.getDate()-1);
    const yStr = yD.toDateString();
    const weekAgo = new Date(nowD); weekAgo.setDate(nowD.getDate()-7);

    sessions
      .sort((a,b)=> new Date(b.updatedAt) - new Date(a.updatedAt))
      .forEach(s=>{
        const d = new Date(s.updatedAt || s.createdAt);
        if(d.toDateString() === todayStr) res.today.push(s);
        else if(d.toDateString() === yStr) res.yesterday.push(s);
        else if(d >= weekAgo) res.week.push(s);
      });
    return res;
  }

  function beginInlineRename(itemEl, sessionId){
    const titleEl = itemEl.querySelector('.hi-title');
    if(!titleEl) return;
    const oldTitle = titleEl.textContent || '';
    if(itemEl.querySelector('.hi-edit')) return;

    const input = document.createElement('input');
    input.type = 'text';
    input.value = oldTitle;
    input.className = 'hi-edit';
    input.setAttribute('maxlength','90');
    titleEl.replaceWith(input);
    input.focus();
    input.select();

    function cleanup(){ input.replaceWith(titleEl); }
    function save(){
      const newVal = input.value.trim() || 'Nieuw gesprek';
      const sessions = loadSessions();
      const idx = sessions.findIndex(s=>s.id===sessionId);
      if(idx>=0){
        sessions[idx].title = newVal;
        sessions[idx].updatedAt = now();
        saveSessions(sessions);
      }
      renderHistory();
    }
    function onKey(e){
      if(e.key==='Enter'){ e.preventDefault(); save(); }
      else if(e.key==='Escape'){ e.preventDefault(); cleanup(); }
    }
    function onBlur(){ save(); }

    input.addEventListener('keydown', onKey);
    input.addEventListener('blur', onBlur);
  }

  function ensureCurrentSession(){
    let id = getCurrentId();
    let sessions = loadSessions();
    let ses = sessions.find(s=>s.id===id);
    if(!ses){
      ses = { id: uid(), title: 'Nieuw gesprek', createdAt: now(), updatedAt: now(), messages: [], threadId: null };
      sessions.push(ses);
      setCurrentId(ses.id);
      saveSessions(sessions);
      renderHistory();
    }
    if (typeof ses.threadId === 'undefined') {
      ses.threadId = null;
      saveSessions(sessions);
    }
    return ses;
  }

  function openSession(id){
    const sessions = loadSessions();
    const ses = sessions.find(s=>s.id===id);
    if(!ses) return;
    setCurrentId(id);
    chatlog.innerHTML='';
    (ses.messages || []).forEach(m=> addMessage(m.text, m.who, new Date(m.at), false));
    if(ses.messages?.length){ hideHero(); hideCards(); } else { showHero(); showCards(); }
    renderHistory();
  }

  function addMessage(text, who = 'assistant', timeObj = new Date(), animate = false) {
    const msg = document.createElement('div');
    msg.className = `msg ${who}`;
    const wrap = document.createElement('div');
    wrap.className = 'bubble-wrap';

    if (who === 'assistant') {
      const { html, sources, headerLabel } = parseMessageWithCitations(text);
      const bubble = document.createElement('div');
      bubble.className = 'bubble';

      if (animate) {
        bubble.innerHTML = '<span class="typing-cursor"></span>';
        wrap.appendChild(bubble);
        msg.appendChild(wrap);
        chatlog.appendChild(msg);
        chatlog.scrollTop = chatlog.scrollHeight;
        typewriterEffect(bubble, html, sources, wrap, headerLabel);
      } else {
        bubble.innerHTML = html;
        wrap.appendChild(bubble);
        if (sources.length > 0) {
          const citationsEl = document.createElement('div');
          citationsEl.innerHTML = renderCitationsBlock(sources, headerLabel);
          wrap.appendChild(citationsEl.firstElementChild);
          attachCitationHandlers(bubble, wrap, sources);
        }
        msg.appendChild(wrap);
        chatlog.appendChild(msg);
        chatlog.scrollTop = chatlog.scrollHeight;
      }
    } else {
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = text;
      wrap.appendChild(bubble);

      const meta = document.createElement('div');
      meta.className = 'meta';
      const t = document.createElement('span');
      t.className = 'time';
      t.textContent = timeHHMM(timeObj);
      const tick = document.createElement('span');
      tick.className = 'tick';
      tick.innerHTML = `<svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M5 13l4 4L19 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>`;
      meta.appendChild(t);
      meta.appendChild(tick);
      wrap.appendChild(meta);

      msg.appendChild(wrap);
      chatlog.appendChild(msg);
      chatlog.scrollTop = chatlog.scrollHeight;
    }
  }

  function typewriterEffect(bubble, html, sources, wrap, headerLabel) {
    const CHARS_PER_FRAME = 3;
    const FRAME_DELAY = 16;

    let currentIndex = 0;
    const cursor = bubble.querySelector('.typing-cursor');

    function typeNextChunk() {
      if (currentIndex >= html.length) {
        cursor?.remove();
        bubble.innerHTML = html;

        if (sources.length > 0) {
          const citationsEl = document.createElement('div');
          citationsEl.innerHTML = renderCitationsBlock(sources, headerLabel);
          wrap.appendChild(citationsEl.firstElementChild);
          attachCitationHandlers(bubble, wrap, sources);
        }
        chatlog.scrollTop = chatlog.scrollHeight;
        return;
      }
      const endIndex = Math.min(currentIndex + CHARS_PER_FRAME, html.length);
      const chunk = html.substring(0, endIndex);
      bubble.innerHTML = chunk + '<span class="typing-cursor"></span>';
      currentIndex = endIndex;

      if (chatlog.scrollHeight - chatlog.scrollTop - chatlog.clientHeight < 100) {
        chatlog.scrollTop = chatlog.scrollHeight;
      }
      requestAnimationFrame(() => { setTimeout(typeNextChunk, FRAME_DELAY); });
    }
    typeNextChunk();
  }

function attachCitationHandlers(bubble, wrap, sources) {
  bubble.querySelectorAll('.citation-ref').forEach(ref => {
    ref.addEventListener('click', function () {
      const num = this.getAttribute('data-citation');

      // probeer eerst de multi-bronnen lijst
      let item = wrap.querySelector(`.citation-item[data-source="${num}"]`);
      if (item) {
        wrap.querySelectorAll('.citation-item').forEach(c => c.classList.remove('highlight'));
        item.classList.add('highlight');
        item.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        setTimeout(() => item.classList.remove('highlight'), 1500);
        return;
      }

      // fallback: single-bron layout
      const singleLink = wrap.querySelector('.citations.single .citation-link');
      if (singleLink) {
        singleLink.classList.add('highlight');
        singleLink.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        setTimeout(() => singleLink.classList.remove('highlight'), 1500);

        // optioneel: open ook de URL (indien aanwezig)
        const href = singleLink.getAttribute('href');
        if (href) window.open(href, '_blank', 'noopener');
      }
    });
  });
}


  let sending = false;
  async function sendMessage() {
    if (sending) return;
    if (popup.classList.contains('show') || delPopup.classList.contains('show') || sendBtn.disabled) return;

    const text = promptInput.value.trim();
    if (!text) return;

    const current = ensureCurrentSession();

    const nowTime = new Date();
    addMessage(text, 'user', nowTime);
    persistMessage(text, 'user');
    promptInput.value = '';
    hideCards(); hideHero();

    sending = true;
    showTyping();

    try{
      const result = await callAgent(text, current.threadId);
      hideTyping();
      const reply = String(result.replyText || 'OK');
      addMessage(reply, 'assistant', new Date(), true);
      persistMessage(reply, 'assistant');

      const sessions = loadSessions();
      const idx = sessions.findIndex(s=>s.id===current.id);
      if(idx>=0){
        sessions[idx].threadId = result.threadId || sessions[idx].threadId || null;
        sessions[idx].updatedAt = now();
        saveSessions(sessions);
        renderHistory();
      }
    }catch(e){
      hideTyping();
      const errMsg = toDisplayString(e?.message || e || 'Er ging iets mis met de verbinding.');
      const shown = '⚠️ Serverfout: ' + errMsg;
      addMessage(shown, 'assistant', new Date(), false);
      persistMessage(shown, 'assistant');
    }finally{
      sending = false;
    }
  }

  sendBtn.addEventListener('click', sendMessage);
  promptInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); sendMessage(); } });

  newChatBtn.addEventListener('click', startNewSession);

  ensureCurrentSession();
  renderHistory();
</script>
